name: BUILD-CLP-001-S Governance Health Gate
on:
  pull_request:
    paths:
      - 'governance/clp-001/builds/BUILD-CLP-001-S/**'
      - '.github/workflows/build-clp-001-s-postgres.yml'
jobs:
  postgres-s-health:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen S source manifest
        run: |
          root=governance/clp-001/builds/BUILD-CLP-001-S
          manifest="$root/receipts/S-source-manifest.json"
          echo '44b54a18e88ca6e547f6f6a9bc55214194422507aa0eb7c22f7e04524944404d  '"$manifest" | sha256sum -c -
          python - <<'PY'
          import json,hashlib,pathlib
          root=pathlib.Path('governance/clp-001/builds/BUILD-CLP-001-S')
          m=json.loads((root/'receipts/S-source-manifest.json').read_text())
          for e in m['files']:
              p=(pathlib.Path('.')/e['path']) if e['path'].startswith('.github/') else (root/e['path'])
              b=p.read_bytes(); h=hashlib.sha256(b).hexdigest()
              assert len(b)==e['bytes'],(e['path'],len(b),e['bytes'])
              assert h==e['sha256'],(e['path'],h,e['sha256'])
              print('S_MANIFEST_PASS',e['path'],len(b),h)
          PY
      - name: Report workflow hash
        run: sha256sum .github/workflows/build-clp-001-s-postgres.yml
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply Q, R, S migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f governance/clp-001/builds/BUILD-CLP-001-Q/migrations/001_clp001_q.sql
          psql -v ON_ERROR_STOP=1 -f governance/clp-001/builds/BUILD-CLP-001-R/migrations/002_clp001_r.sql
          psql -v ON_ERROR_STOP=1 -f governance/clp-001/builds/BUILD-CLP-001-S/migrations/003_clp001_s_governance_health.sql
      - name: Load repository governance observations
        run: psql -v ON_ERROR_STOP=1 -f governance/clp-001/builds/BUILD-CLP-001-S/fixtures/repository-observations.sql
      - name: Run deterministic S health rules T1-T10
        run: psql -v ON_ERROR_STOP=1 -f governance/clp-001/builds/BUILD-CLP-001-S/tests/s-health.sql
      - name: Verify live EdOpSys projection
        run: |
          actual=$(psql -Atc "SELECT overall_health FROM edopsys_observability.v_repository_health WHERE repository='JaeTierce31/EdOpSys'")
          blockers=$(psql -Atc "SELECT blocking_reason_count FROM edopsys_observability.v_repository_health WHERE repository='JaeTierce31/EdOpSys'")
          test "$actual" = "DEGRADED"
          test "$blockers" = "0"
          json=$(psql -Atc "SELECT dashboard::text FROM edopsys_observability.v_dashboard_summary_json WHERE repository='JaeTierce31/EdOpSys'")
          test -n "$json"
          echo "$json"
